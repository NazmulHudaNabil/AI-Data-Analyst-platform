name: AI Data Analyst CD

on:
  push:
    branches: [ "main", "master" ]
  workflow_run:
    workflows: ["AI Data Analyst CI"]
    types:
      - completed

jobs:
  deploy-to-render:
    runs-on: ubuntu-latest
    # Only run the deploy job if the CI workflow was completely successful
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' }}
    
    steps:
    - name: Deploy Backend to Render
      run: |
        # Triggers Render to fetch the latest code from GitHub and build the Backend Docker image
        curl -X POST ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        
    - name: Deploy Frontend to Vercel
      run: |
        # Triggers Vercel to fetch the latest code from GitHub and build the Next.js Frontend
        curl -X POST ${{ secrets.VERCEL_DEPLOY_HOOK }}
