name: AI Data Analyst CD

on:
  push:
    branches: [ "main", "master" ]
  workflow_run:
    workflows: ["AI Data Analyst CI"]
    types:
      - completed

jobs:
  deploy-backend-heroku:
    runs-on: ubuntu-latest
    # Only run the deploy job if the CI workflow was completely successful (or manually triggered by a push if CI is bypassed)
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' }}
    
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      
    - name: Log in to Heroku Container Registry
      env:
        HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      run: docker login --username=_ --password=$HEROKU_API_KEY registry.heroku.com

    - name: Build and Push Docker Image to Heroku
      env:
        HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
      run: |
        cd backend
        docker build -t registry.heroku.com/$HEROKU_APP_NAME/web .
        docker push registry.heroku.com/$HEROKU_APP_NAME/web

    - name: Release Docker Image to Heroku App
      env:
        HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
      run: |
        # Fetch the Image ID of the pushed container
        IMAGE_ID=$(docker inspect registry.heroku.com/$HEROKU_APP_NAME/web --format={{.Id}})
        
        # Trigger Heroku to release the image to the web dyno
        curl -n -X PATCH https://api.heroku.com/apps/$HEROKU_APP_NAME/formation \
          -d '{"updates": [{"type": "web", "docker_image": "'$IMAGE_ID'"}]}' \
          -H "Content-Type: application/json" \
          -H "Accept: application/vnd.heroku+json; version=3.docker-releases" \
          -H "Authorization: Bearer $HEROKU_API_KEY"
