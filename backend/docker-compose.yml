version: '3.8'

services:
  api:
    build: .
    container_name: ai-data-analyst-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Mount data and visualizations so generated files persist on the host
      - ./data:/app/data
      - ./visualizations:/app/visualizations
    restart: unless-stopped
